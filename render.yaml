services:
  - type: web
    name: agriintel-karnataka
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: sqlite:////app/agriintel.db
      - key: AGRIINTEL_DB_PATH
        value: /app/agriintel.db

